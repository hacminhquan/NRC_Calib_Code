[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nrc-cal"
version = "0.1.0"
description = "Frozen-model NRC geometry for probabilistic calibration"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "torch>=2.2",
  "scikit-learn>=1.4", "matplotlib>=3.8", "seaborn>=0.13",
  "plotly>=5.18", "PyYAML>=6.0", "rich>=13.7", "tqdm>=4.66"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
